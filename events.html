<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events – The Pink Chronicles</title>
  <link rel="icon" type="image/png" href="images/favicon-64x64.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-page">

  <!-- ===== SIDEBAR ===== -->
  <aside class="dash-sidebar" id="dashSidebar">
    <a href="index.html" class="dash-sidebar-logo">
      <i class="fa-solid fa-microphone-lines"></i>
      <div>
        <span class="dash-logo-text-top">THE PINK</span>
        <span class="dash-logo-text-main">CHRONICLES</span>
      </div>
    </a>

    <nav class="dash-nav">
      <a href="dashboard.html" class="dash-nav-link">
        <i class="fa-solid fa-house"></i> Home
      </a>
      
      <a href="events.html" class="dash-nav-link active">
        <i class="fa-regular fa-calendar-days"></i> Events
      </a>
      <a href="stories.html" class="dash-nav-link">
        <i class="fa-solid fa-book-open"></i> Stories
      </a>
      
      <a href="members.html" class="dash-nav-link">
        <i class="fa-solid fa-people-group"></i> Members
      </a>
      <a href="messages.html" class="dash-nav-link">
        <i class="fa-regular fa-envelope"></i> Messages
      </a>
      
      <a href="settings.html" class="dash-nav-link">
        <i class="fa-solid fa-gear"></i> Settings
      </a>
      <a href="index.html" class="dash-nav-link" onclick="hubLogout(); return false;">
        <i class="fa-solid fa-right-from-bracket"></i> Log Out
      </a>
    </nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="dash-main">

    <!-- Top bar -->
    <header class="dash-topbar">
      <button class="dash-topbar-menu" onclick="document.getElementById('dashSidebar').classList.toggle('open')" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="dash-step-badge">
        <i class="fa-solid fa-calendar-days"></i>
        UPCOMING EVENTS
      </div>

      <div class="dash-topbar-title-block">
        <div class="dash-topbar-sub">DON'T MISS OUT</div>
      </div>

      <!-- Stats -->
      <div class="dash-topbar-stats">
        <div class="dash-stat-pill dash-stat-streak">
          <span class="dash-stat-num">
            7 <i class="fa-solid fa-fire"></i>
          </span>
          <span class="dash-stat-label">Day Streak</span>
        </div>
        <div class="dash-stat-pill dash-stat-points">
          <span class="dash-stat-num">
            450 <i class="fa-solid fa-star"></i>
          </span>
          <span class="dash-stat-label">Pink Points</span>
        </div>
      </div>

      <!-- User chip -->
      <div class="dash-topbar-user">
        <div class="dash-user-avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <div class="dash-user-name" id="dashUserName">Pink Star</div>
          <div class="dash-user-role">Community Member</div>
          <a href="settings.html" class="dash-view-profile">
            View Profile <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </header>

    <!-- Greeting bar -->
    <div class="dash-greet-bar" id="dashGreetBar">
      <i class="fa-solid fa-hand-sparkles"></i>
      Hi, <strong id="dashGreetName">Pink Star</strong>! &nbsp;
      So happy to see you here! Remember, you are enough just as you are.
      <i class="fa-solid fa-heart"></i>
    </div>


    <!-- Page content -->
    <div class="dash-content">
      <div id="eventsList" class="events-list">
        <p class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><br>Loading events…</p>
      </div>
    </div><!-- /dash-content -->
  </div><!-- /dash-main -->

  <div id="dashToast" class="dash-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/hub-auth.js"></script>
  <script src="js/hub-data.js"></script>
  <script>
    'use strict';
    let toastTimer = null;
    function showDashToast(msg) {
      const el = document.getElementById('dashToast');
      el.innerHTML = `<i class="fa-solid fa-heart"></i> ${msg}`;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
    document.addEventListener('click', function(e) {
      const sidebar = document.getElementById('dashSidebar');
      const menuBtn = document.querySelector('.dash-topbar-menu');
      if (sidebar && menuBtn && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) sidebar.classList.remove('open');
    });
    document.querySelectorAll('.dash-nav-link[href="#"]').forEach(link => {
      link.addEventListener('click', e => { e.preventDefault(); showDashToast("This is coming soon! 💕"); });
    });

    (async function() {
      const member = await hubRequireMember();
      if (!member) return;
      hubRenderTopStats(member);
      document.querySelectorAll('#dashUserName, #dashGreetName').forEach(el => { el.textContent = member.nickname || member.name || 'Pink Star'; });

      const events = await hubFetchUpcomingEvents();
      const list = document.getElementById('eventsList');
      if (!events.length) {
        list.innerHTML = '<p class="empty-state"><i class="fa-regular fa-calendar"></i><br>No events scheduled yet — check back soon!</p>';
        return;
      }
      const monthNames = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      list.innerHTML = `<div class="section-card">${events.map(ev => {
        const d = ev.event_date ? new Date(ev.event_date) : null;
        return `
        <div class="dash-event-row" style="padding:16px 20px;">
          <div class="dash-event-date">
            <span class="dash-event-month">${d ? monthNames[d.getMonth()] : '—'}</span>
            <span class="dash-event-day">${d ? d.getDate() : '—'}</span>
          </div>
          <div class="dash-event-info">
            <div class="dash-event-name" style="font-size:.95rem;">${hubEsc(ev.title)}</div>
            <div class="dash-event-desc">${hubEsc(ev.description || '')}</div>
          </div>
          <span class="dash-event-time">${hubEsc(ev.event_time || '')}</span>
        </div>`;
      }).join('')}</div>`;
    })();
  </script>

</body>
</html>
